# SMP Manager 1.1 - edit this file while the server is stopped, then start it again.
# One Paper server stays running. Closed worlds are saved, frozen and protected.
players-required-to-open=5
# Close when eligible online players fall BELOW this number (4 means 3 or fewer).
minimum-online-players=4
grace-period-seconds=300
startup-join-window-seconds=180
autopass-grace-seconds=3600
queue.reservation-minutes=60
queue.renew-cooldown-seconds=300
afk.enabled=false
afk.timeout-seconds=300
# Optional authenticated UUIDs allowed to use /smp autopass; not other admin commands.
admins.autopass-uuids=

# The Discord bot runs inside this plugin. No separate bot host is needed.
# Leave disabled for Minecraft-only operation. Never share your configured token file.
discord.enabled=false
discord.token=
discord.guild-id=
discord.status-channel-id=
discord.notification-channel-id=
# Comma-separated numeric role IDs. Admins also need Discord Manage Server permission.
discord.admin-role-ids=
discord.status-update-seconds=10
verification.request_cooldown_seconds=30
verification.allow_manual_admin_verification=true
