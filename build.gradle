plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}
group='dev.smpmanager'
version='1.1.2'
repositories {
    mavenCentral()
    maven { url='https://repo.papermc.io/repository/maven-public/' }
}
java { toolchain { languageVersion=JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release=25 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.244-stable'
    implementation 'net.dv8tion:JDA:5.6.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.2'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyLocking { lockAllConfigurations() }
test { useJUnitPlatform(); jvmArgs '--enable-native-access=ALL-UNNAMED'; testLogging { events 'failed','skipped' } }
shadowJar {
    archiveFileName='SMP-Manager.jar'
    mergeServiceFiles()
    exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'
    relocate 'com.fasterxml.jackson','dev.smpmanager.lib.jackson'
    relocate 'net.dv8tion.jda','dev.smpmanager.lib.jda'
}
jar { archiveClassifier='thin' }
assemble.dependsOn shadowJar
